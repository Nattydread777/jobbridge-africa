name: Keep Render Backend Alive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Check backend health
        run: |
          status_code=$(curl --silent --show-error --retry 3 --retry-delay 5 --retry-all-errors --max-time 30 --output /dev/null --write-out "%{http_code}" https://jobbridge-backend.onrender.com/api/contact/health || true)
          echo "HTTP status code: ${status_code:-000}"
          if [ "$status_code" != "200" ]; then
            exit 1
          fi
